name: Build Godot Project
description: "Builds a Godot project for Linux"
author: "Your Name"

runs:
  using: "composite"
  steps:
    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v1
      with:
        version: ${{ inputs.godot-version }}
        use-dotnet: false

    - name: Reimport
      shell: bash
      run: godot --editor --headless --quit || true

    - name: Build
      shell: bash
      run: |
        mkdir -p ${{ inputs.build-dir }}/linux-86_64
        godot --export-debug "Linux/x86_64" --headless
        ["$(ls -A ${{ inputs.build-dir }}/linux-86_64)"]

    - name: Compress
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        cd ${{ inputs.build-dir }}/
        tar -czpf ./linux-x86_64.tar.gz ./*

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64
        path: ${{ inputs.project-dir }}/${{ inputs.build-dir }}/linux-x86_64/linux-x86_64.tar.gz

inputs:
  godot-version:
    description: "Godot version to use"
    required: false
    default: "4.3.0"
  project-dir:
    description: "Project directory"
    required: false
    default: "."
  build-dir:
    description: "Build directory"
    required: false
    default: "build"
  export-preset:
    description: "Export preset name"
    required: false
    default: "Linux/x86_64"
  output-path:
    description: "Output path for the build"
    required: false
    default: "build/linux-x86_64"
outputs:
  build-path:
    description: "Path to the built artifact"
    value: ${{ steps.build.outputs.build-path }}
