name: "Fix Windows OpenMPT DLLs"

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if DLLs already exist'
        required: false
        default: false
        type: boolean

env:
  MINGW_DLLS: "libgcc_s_seh-1.dll libstdc++-6.dll"
  RUNTIME_DIR: "src/addons/godot-openmpt/bin/runtime"

jobs:
  extract-mingw-dlls:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check if DLLs already exist
        id: check-dlls
        shell: bash
        run: |
          missing_dlls=()
          for dll in ${{ env.MINGW_DLLS }}; do
            if [ ! -f "${{ env.RUNTIME_DIR }}/$dll" ]; then
              missing_dlls+=("$dll")
            fi
          done

          if [ ${#missing_dlls[@]} -eq 0 ] && [ "${{ github.event.inputs.force_update }}" != "true" ]; then
            echo "All DLLs exist and force_update is false"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Missing DLLs: ${missing_dlls[*]}"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup MSYS2
        if: steps.check-dlls.outputs.skip == 'false'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Find and extract MinGW DLLs
        if: steps.check-dlls.outputs.skip == 'false'
        shell: bash
        run: |
          # Create runtime directory
          mkdir -p "${{ env.RUNTIME_DIR }}"

          # Find MinGW installation paths
          mingw_paths=(
            "C:/msys64/mingw64/bin"
            "C:/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin"
            "C:/tools/mingw64/bin"
          )

          # Also check where MSYS2 installed MinGW
          if command -v pacman &> /dev/null; then
            msys2_mingw="/c/msys64/mingw64/bin"
            mingw_paths+=("$msys2_mingw")
          fi

          echo "Searching for MinGW DLLs in the following paths:"
          for path in "${mingw_paths[@]}"; do
            echo "  - $path"
          done

          # Find and copy required DLLs
          for dll in ${{ env.MINGW_DLLS }}; do
            found=false
            for path in "${mingw_paths[@]}"; do
              if [ -f "$path/$dll" ]; then
                echo "Found $dll in $path"
                cp "$path/$dll" "${{ env.RUNTIME_DIR }}/"
                echo "Copied $dll to runtime directory"
                found=true
                break
              fi
            done

            if [ "$found" = false ]; then
              echo "ERROR: Could not find $dll in any MinGW path"
              exit 1
            fi
          done

      - name: Verify DLL extraction
        if: steps.check-dlls.outputs.skip == 'false'
        shell: bash
        run: |
          echo "Verifying extracted DLLs:"
          ls -la "${{ env.RUNTIME_DIR }}/"

          for dll in ${{ env.MINGW_DLLS }}; do
            if [ -f "${{ env.RUNTIME_DIR }}/$dll" ]; then
              echo "✓ $dll found"
              file "${{ env.RUNTIME_DIR }}/$dll"
            else
              echo "✗ $dll missing"
              exit 1
            fi
          done

      - name: Update export presets
        if: steps.check-dlls.outputs.skip == 'false'
        shell: bash
        run: |
          export_presets="src/export_presets.cfg"

          if [ ! -f "$export_presets" ]; then
            echo "ERROR: export_presets.cfg not found"
            exit 1
          fi

          # Create backup
          cp "$export_presets" "${export_presets}.backup"

          # Check if runtime DLLs are already included
          if grep -q "runtime/libgcc_s_seh-1.dll" "$export_presets"; then
            echo "Runtime DLLs already included in export presets"
          else
            echo "Adding runtime DLLs to Windows export preset..."

            # Find the Windows preset section and add runtime DLLs
            python3 -c "
import re
import sys

with open('$export_presets', 'r') as f:
    content = f.read()

# Find Windows preset section
windows_pattern = r'(\[preset\.\d+\][\s\S]*?name=\"Windows\"[\s\S]*?)file_customization/include_binaries=PackedStringArray\((.*?)\)'
match = re.search(windows_pattern, content)

if match:
    prefix = match.group(1)
    current_binaries = match.group(2)

    # Add runtime DLLs to the list
    runtime_dlls = [
        '\"res://addons/godot-openmpt/bin/runtime/libgcc_s_seh-1.dll\"',
        '\"res://addons/godot-openmpt/bin/runtime/libstdc++-6.dll\"'
    ]

    if current_binaries.strip():
        new_binaries = current_binaries + ', ' + ', '.join(runtime_dlls)
    else:
        new_binaries = ', '.join(runtime_dlls)

    # Replace the line
    new_content = content.replace(
        match.group(0),
        prefix + 'file_customization/include_binaries=PackedStringArray(' + new_binaries + ')'
    )

    with open('$export_presets', 'w') as f:
        f.write(new_content)

    print('Successfully updated export presets')
else:
    print('Could not find Windows export preset')
    sys.exit(1)
"
          fi

      - name: Create Windows runtime README
        if: steps.check-dlls.outputs.skip == 'false'
        shell: bash
        run: |
          cat > "${{ env.RUNTIME_DIR }}/README.md" << 'EOF'
# Windows OpenMPT Runtime DLLs

This directory contains the MinGW runtime DLLs required for the OpenMPT addon to work on Windows.

## Files:
- `libgcc_s_seh-1.dll`: GCC runtime library for structured exception handling
- `libstdc++-6.dll`: GNU C++ standard library

## Why these are needed:
The OpenMPT addon was compiled with MinGW-w64, which requires these runtime libraries.
Windows systems don't have these DLLs by default, causing Error 126 when trying to load
the OpenMPT library.

## Installation:
These DLLs are automatically included in Windows builds via the export presets.
They will be bundled with your game executable.

## Technical Details:
- **Error 126**: "The specified module could not be found" - means dependencies are missing
- **MinGW-w64**: GNU Compiler Collection for Windows
- **OpenMPT**: Open ModPlug Tracker - library for playing tracker music formats
- **Godot 4.3**: This project uses Godot 4.3 with GDExtension system

## Auto-generated:
These DLLs were automatically extracted from the GitHub Actions Windows runner using MinGW-w64.
If you need to update them, run the "Fix Windows OpenMPT DLLs" workflow.

Generated on: $(date)
Runner OS: Windows (GitHub Actions)
MinGW Version: $(gcc --version | head -n1 2>/dev/null || echo "Unknown")
EOF

      - name: Commit changes
        if: steps.check-dlls.outputs.skip == 'false'
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add "${{ env.RUNTIME_DIR }}/"
          git add "src/export_presets.cfg"

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Windows MinGW runtime DLLs for OpenMPT

- Add libgcc_s_seh-1.dll and libstdc++-6.dll to runtime directory
- Update export presets to include runtime DLLs in Windows builds
- Fix Error 126 when loading OpenMPT on Windows systems

Auto-generated by GitHub Actions workflow"

            git push
            echo "Changes committed and pushed successfully"
          fi

      - name: Summary
        shell: bash
        run: |
          if [ "${{ steps.check-dlls.outputs.skip }}" = "true" ]; then
            echo "## ✅ DLLs Already Present" >> $GITHUB_STEP_SUMMARY
            echo "All required MinGW runtime DLLs are already present in the repository." >> $GITHUB_STEP_SUMMARY
            echo "No action was taken." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Windows OpenMPT DLLs Fixed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Successfully extracted and committed MinGW runtime DLLs:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for dll in ${{ env.MINGW_DLLS }}; do
              echo "- ✅ $dll" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### What was done:" >> $GITHUB_STEP_SUMMARY
            echo "1. Extracted required DLLs from GitHub runner's MinGW installation" >> $GITHUB_STEP_SUMMARY
            echo "2. Placed DLLs in \`${{ env.RUNTIME_DIR }}/\`" >> $GITHUB_STEP_SUMMARY
            echo "3. Updated \`src/export_presets.cfg\` to include DLLs in Windows builds" >> $GITHUB_STEP_SUMMARY
            echo "4. Created documentation in runtime directory" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next steps:" >> $GITHUB_STEP_SUMMARY
            echo "- Windows builds will now automatically include these runtime DLLs" >> $GITHUB_STEP_SUMMARY
            echo "- Error 126 should be resolved for Windows users" >> $GITHUB_STEP_SUMMARY
            echo "- Test the Windows build to verify the fix works" >> $GITHUB_STEP_SUMMARY
          fi
