name: "Submit Dev"

on:
  push:
    branches: ["dev"]

env:
  GODOT_VERSION: 4.3.0
  GODOT_VERSION_MAC_PI: 4.3
  LFS_USERNAME: ${{secrets.LFS_USERNAME}}
  LFS_PASSWORD: ${{secrets.LFS_PASSWORD}}
  OPENMPT_VERSION: v1.3.2

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Bump patch version and push
        id: bump
        run: |
          set -euo pipefail
          OLD=$(grep -oP '^config/version="\K[^"]+' src/project.godot)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "Bumping ${OLD} -> ${NEW}"
          sed -i "s|^config/version=\"${OLD}\"|config/version=\"${NEW}\"|" src/project.godot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/project.godot
          git commit -m "chore: bump version to ${NEW} [skip ci]"
          git push origin dev
          echo "new-version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "new-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: bump-version
    runs-on: macos-15-intel
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}

      - name: Configure Git LFS
        run: git config -f .lfsconfig lfs.url https://${{env.LFS_USERNAME}}:${{env.LFS_PASSWORD}}@git-lfs-s3-proxy-984.pages.dev/c8076907f522754d603bf3b68096609c.r2.cloudflarestorage.com/realmz-remake

      - name: Checkout LFS
        run: git lfs fetch --all && git lfs checkout

      - name: Cache OpenMPT Plugin
        uses: actions/cache@v4
        with:
          path: src/addons/godot-openmpt
          key: openmpt-${{ env.OPENMPT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenMPT Plugin
        run: python3 install_godot_openmpt.py

      - name: Verify OpenMPT Plugin Installation
        run: |
          if [ ! -f "src/addons/godot-openmpt/plugin.cfg" ]; then
            echo "Plugin not found, forcing reinstall..."
            python3 install_godot_openmpt.py --force
          fi
          echo "Verifying macOS libraries:"
          ls -la src/addons/godot-openmpt/bin/*darwin* || echo "No darwin libraries found"
          echo "Plugin configuration:"
          cat src/addons/godot-openmpt/plugin.cfg
          echo "GDExtension configuration:"
          cat src/addons/godot-openmpt/openmpt.gdextension

      - name: Install Godot
        uses: ./.github/actions/install-godot-macos
        with:
          godot-version: ${{ env.GODOT_VERSION_MAC_PI }}
          install-templates: true
        id: install-godot

      - name: Open Godot editor for reimport and extension loading
        run: |
          cd src
          ${{ steps.install-godot.outputs.godot-executable }} --editor --headless --quit --verbose || true
          sleep 2
          echo "Checking for .godot/extension_list.cfg..."
          if [ -f ".godot/extension_list.cfg" ]; then
            echo "Extension list found:"
            cat .godot/extension_list.cfg
          else
            echo "No extension list found, running import again..."
            ${{ steps.install-godot.outputs.godot-executable }} --import --headless --verbose || true
          fi

      - name: Build and upload artifacts for macOS
        uses: ./.github/actions/build-godot-macos
        with:
          godot-executable: ${{ steps.install-godot.outputs.godot-executable }}
          project-dir: "./src"

  build-linux:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}

      - name: Configure Git LFS
        run: git config -f .lfsconfig lfs.url https://${{env.LFS_USERNAME}}:${{env.LFS_PASSWORD}}@git-lfs-s3-proxy-984.pages.dev/c8076907f522754d603bf3b68096609c.r2.cloudflarestorage.com/realmz-remake

      - name: Checkout LFS
        run: git lfs fetch --all && git lfs checkout

      - name: Cache OpenMPT Plugin
        uses: actions/cache@v4
        with:
          path: src/addons/godot-openmpt
          key: openmpt-${{ env.OPENMPT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenMPT Plugin
        run: python3 install_godot_openmpt.py

      - name: Verify OpenMPT Plugin Installation
        run: |
          if [ ! -f "src/addons/godot-openmpt/plugin.cfg" ]; then
            echo "Plugin not found, forcing reinstall..."
            python3 install_godot_openmpt.py --force
          fi
          echo "Verifying Linux libraries:"
          ls -la src/addons/godot-openmpt/bin/*linux* || echo "No linux libraries found"
          echo "Plugin configuration:"
          cat src/addons/godot-openmpt/plugin.cfg
          echo "GDExtension configuration:"
          cat src/addons/godot-openmpt/openmpt.gdextension

      - name: Setup Godot for Linux
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Initialize Godot extensions
        run: |
          cd src
          godot --editor --headless --quit --verbose || true
          sleep 2
          echo "Checking for .godot/extension_list.cfg..."
          if [ -f ".godot/extension_list.cfg" ]; then
            echo "Extension list found:"
            cat .godot/extension_list.cfg
          else
            echo "No extension list found, running import again..."
            godot --import --headless --verbose || true
          fi

      - name: Build and upload artifacts for linux
        uses: ./.github/actions/build-godot-linux
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          project-dir: "./src"

  build-raspberry-pi:
    needs: bump-version
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}

      - name: Configure Git LFS
        run: git config -f .lfsconfig lfs.url https://${{env.LFS_USERNAME}}:${{env.LFS_PASSWORD}}@git-lfs-s3-proxy-984.pages.dev/c8076907f522754d603bf3b68096609c.r2.cloudflarestorage.com/realmz-remake

      - name: Checkout LFS
        run: git lfs fetch --all && git lfs checkout

      - name: Cache OpenMPT Plugin
        uses: actions/cache@v4
        with:
          path: src/addons/godot-openmpt
          key: openmpt-${{ env.OPENMPT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenMPT Plugin
        run: python3 install_godot_openmpt.py

      - name: Verify OpenMPT Plugin Installation
        run: |
          if [ ! -f "src/addons/godot-openmpt/plugin.cfg" ]; then
            echo "Plugin not found, forcing reinstall..."
            python3 install_godot_openmpt.py --force
          fi
          echo "Verifying Linux ARM libraries:"
          ls -la src/addons/godot-openmpt/bin/*linux*arm64* || echo "No linux arm64 libraries found"
          echo "Plugin configuration:"
          cat src/addons/godot-openmpt/plugin.cfg

      - name: Install Godot
        uses: ./.github/actions/install-godot-raspberry-pi
        with:
          godot-version: ${{ env.GODOT_VERSION_MAC_PI }}
          install-templates: true
        id: install-godot

      - name: Open Godot editor for reimport and extension loading
        run: |
          cd src
          ${{ steps.install-godot.outputs.godot-executable }} --editor --headless --quit --verbose || true
          sleep 2
          echo "Checking for .godot/extension_list.cfg..."
          if [ -f ".godot/extension_list.cfg" ]; then
            echo "Extension list found:"
            cat .godot/extension_list.cfg
          else
            echo "No extension list found, running import again..."
            ${{ steps.install-godot.outputs.godot-executable }} --import --headless --verbose || true
          fi

      - name: Build and upload artifacts for raspberry pi
        uses: ./.github/actions/build-godot-raspberry-pi
        with:
          project-dir: "./src"

  build-windows:
    needs: bump-version
    runs-on: windows-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}

      - name: Configure Git LFS
        run: git config -f .lfsconfig lfs.url https://${{env.LFS_USERNAME}}:${{env.LFS_PASSWORD}}@git-lfs-s3-proxy-984.pages.dev/c8076907f522754d603bf3b68096609c.r2.cloudflarestorage.com/realmz-remake

      - name: Checkout LFS
        run: git lfs fetch --all && git lfs checkout

      - name: Cache OpenMPT Plugin
        uses: actions/cache@v4
        with:
          path: src/addons/godot-openmpt
          key: openmpt-${{ env.OPENMPT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenMPT Plugin
        run: python3 install_godot_openmpt.py

      - name: Verify OpenMPT Plugin Installation
        shell: bash
        run: |
          if [ ! -f "src/addons/godot-openmpt/plugin.cfg" ]; then
            echo "Plugin not found, forcing reinstall..."
            python3 install_godot_openmpt.py --force
          fi
          echo "Verifying Windows libraries:"
          ls -la src/addons/godot-openmpt/bin/*windows* || echo "No windows libraries found"
          echo "Plugin configuration:"
          cat src/addons/godot-openmpt/plugin.cfg

      - name: Setup Godot for Windows
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Initialize Godot extensions
        shell: bash
        run: |
          cd src
          godot --editor --headless --quit --verbose || true
          sleep 2
          echo "Checking for .godot/extension_list.cfg..."
          if [ -f ".godot/extension_list.cfg" ]; then
            echo "Extension list found:"
            cat .godot/extension_list.cfg
          else
            echo "No extension list found, running import again..."
            godot --import --headless --verbose || true
          fi

      - name: Build and upload artifacts for windows
        uses: ./.github/actions/build-godot-windows
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          project-dir: "./src"

  generate-release:
    needs: [bump-version, build-windows, build-raspberry-pi, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.new-sha }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Realmz-Remake-macos
          path: artifacts/Realmz-Remake-macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Realmz-Remake-windows-x86_64
          path: artifacts/Realmz-Remake-windows-x86_64

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Realmz-Remake-linux-x86_64
          path: artifacts/Realmz-Remake-linux-x86_64

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: Realmz-Remake-linux-aarch64
          path: artifacts/Realmz-Remake-linux-aarch64

      - name: Tag and upload artifacts to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.bump-version.outputs.new-version }}
          commit: ${{ needs.bump-version.outputs.new-sha }}
          allowUpdates: false
          artifactErrorsFailBuild: true
          prerelease: true
          artifacts: artifacts/*/*
