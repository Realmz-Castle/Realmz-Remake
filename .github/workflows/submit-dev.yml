name: "Submit Dev"

on:
  push:
    branches: ["dev"]

env:
  GODOT_VERSION: 4.3
  PROJECT_FILE: src/project.godot
  VERSION_REGEX: config\/version=\"\K[0-9.\-A-z]*
  LFS_USERNAME: ${{secrets.LFS_USERNAME}}
  LFS_PASSWORD: ${{secrets.LFS_PASSWORD}}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Configure Git LFS
        run: git config -f .lfsconfig lfs.url https://${{env.LFS_USERNAME}}:${{env.LFS_PASSWORD}}@git-lfs-s3-proxy-984.pages.dev/c8076907f522754d603bf3b68096609c.r2.cloudflarestorage.com/realmz-remake

      - name: Checkout LFS
        run: git lfs fetch --all && git lfs checkout

      - name: Install Godot
        uses: CapsCollective/godot-actions/install-godot@v1.2
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          install-templates: true
        id: install-godot

      - name: Open Godot editor for reimport
        run: ${{ steps.install-godot.outputs.godot-executable }} --editor --headless --quit || true

      - name: Build and upload artifacts for all platforms
        uses: ./.github/actions/build-godot
        with:
          godot-executable: ${{ steps.install-godot.outputs.godot-executable }}
          project-dir: "./src"

  generate-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Extract version
        uses: CapsCollective/version-actions/extract-version@v1.0
        with:
          version-file: ${{ env.PROJECT_FILE }}
          version-regex: ${{ env.VERSION_REGEX }}
        id: extract-version

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts/macos

      # - name: Download Windows artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: windows
      #     path: artifacts/windows

      # - name: Download Linux artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: linux
      #     path: artifacts/linux

      - name: Tag and upload artifacts to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.extract-version.outputs.version-string }}
          commit: ${{ github.sha }}
          allowUpdates: false
          artifactErrorsFailBuild: true
          prerelease: true
          artifacts: artifacts/*/*
